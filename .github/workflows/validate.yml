name: Validate archive data

# Runs on every push and pull request. If someone drops a comma in data/trees.js,
# this fails loudly here rather than silently emptying the live map.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (used to check the issue forms)
        run: pip install pyyaml

      - name: Check the data files and issue forms
        run: python3 tools/validate.py
