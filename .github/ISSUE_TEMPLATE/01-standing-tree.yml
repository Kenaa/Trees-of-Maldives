name: "🌳 A tree that is still standing"
description: "Record a tree that is alive and in place today | އަދިވެސް ދިރިހުރި ގަހެއް"
title: "[Tree] "
labels: ["tree record", "standing", "unverified"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for adding to the register.

        **You do not need to fill in every box.** A photograph and a street name are
        already a useful record. Someone else can measure it later.

        *ހުރިހާ ގޮޅިއެއް ފުރާކަށް ނުޖެހޭނެ. ފޮޓޯއަކާއި މަގުގެ ނަން އެނގުނަސް ފުދޭ.*

  - type: textarea
    id: photo
    attributes:
      label: "Photograph | ފޮޓޯ"
      description: >
        Drag a photo straight into this box, or click it and paste. GitHub will upload
        and host it for you. The whole tree if you can manage it, trunk and canopy both.
      placeholder: "Drop your photo here"
    validations:
      required: false

  - type: input
    id: place
    attributes:
      label: "Where is it? | ހުރީ ކޮންތާކު؟"
      description: "A street name or a nearby landmark is plenty. | މަގުގެ ނަން ނުވަތަ ކައިރީގައި ހުރި ތަނެއްގެ ނަން ފުދޭ."
      placeholder: "Majeedhee Magu, opposite the school"
    validations:
      required: true

  - type: dropdown
    id: ward
    attributes:
      label: "Ward | އަވަށް"
      options:
        - "Henveiru | ހެންވޭރު"
        - "Galolhu | ގަލޮޅު"
        - "Maafannu | މާފަންނު"
        - "Machchangolhi | މައްޗަންގޮޅި"
        - "Villimalé | ވިލިމާލެ"
        - "Hulhumalé | ހުޅުމާލެ"
    validations:
      required: true

  - type: input
    id: coords
    attributes:
      label: "GPS coordinates | މަޤާމު"
      description: >
        Optional. In your phone's map app, press and hold on the tree's position and copy
        the numbers it shows.
      placeholder: "4.17570, 73.50900"
    validations:
      required: false

  - type: dropdown
    id: species
    attributes:
      label: "What kind of tree is it? | ބާވަތް"
      description: "If you are not sure, choose the last option. Someone else can confirm it."
      options:
        - "Alexandrian laurel · Calophyllum inophyllum | ފުނަ (Funa)"
        - "Allophylus · Allophylus cobbe | ދޮންމޫސާ (Dhon'moosa)"
        - "Banyan · Ficus benghalensis | ނިކަ (Nika)"
        - "Bay cedar · Suriana maritima | ހަލަވެލި (Halaveli)"
        - "Beach cabbage · Scaevola taccada | މަގޫ (Magoo)"
        - "Beach gardenia · Guettarda speciosa | އުނި (Uni)"
        - "Beach hibiscus · Hibiscus tiliaceus | ދިގގަ (Dhigga)"
        - "Betel nut palm · Areca catechu | Fen-foah"
        - "Bilimbi · Averrhoa bilimbi | Bilamagu"
        - "Breadfruit · Artocarpus altilis | ބަނބުކެޔޮ (Ban'bukeyo)"
        - "Castor oil plant · Ricinus communis | Amanaka"
        - "Casuarina · Casuarina equisetifolia | ފިތުރޯނު (Fithuroanu)"
        - "Citron · Citrus medica | Bodu Lun’boa"
        - "Coconut palm · Cocos nucifera | ރުއް (Dhivehi ruh)"
        - "Coffee senna · Senna occidentalis | Dhigu thiyara"
        - "Copper pod · Peltophorum pterocarpum | Reendho varey"
        - "Coral tree · Erythrina orientalis | Berebedhi"
        - "Curry leaf · Murraya koenigii | Hikan’dhi gas"
        - "Custard apple · Annona reticulata | Dhan’digandu atha"
        - "Drumstick tree · Moringa oleifera | Muran’ga gas"
        - "Five-leaved chaste tree · Vitex negundo | Dhunnika"
        - "Flame of the forest · Delonix regia | Ginimaa"
        - "Fragrant pandan · Pandanus amaryllifolius | Raampa faiy"
        - "Frangipani · Plumeria obtusa | ބޮޑު ގުލްޗަމްޕާ (Bodu gulchampa)"
        - "Giant milkweed · Calotropis gigantea | Ruvaa"
        - "Golden shower · Cassia fistula | An’malthassh"
        - "Grey nickernut · Caesalpinia bonduc | Kashi kaburan"
        - "Guava · Psidium guajava | Feyru"
        - "Headache tree · Premna serratifolia | ދަކަންދާ (Dhakan'dhaa)"
        - "Henna tree · Lawsonia inermis | Heenaa"
        - "Horse bush · Desmodium umbellatum | Haalhala"
        - "Indian almond · Terminalia catappa | މިދިލި (Midhili gas)"
        - "Indian coral tree · Erythrina variegata | Faiy kurehi"
        - "Indian gooseberry · Phyllanthus emblica | Beys goan’bili"
        - "Indian jujube · Ziziphus mauritiana | Kunnaaru"
        - "Indian rubber tree · Ficus elastica | Rabaru gas"
        - "Ironwood · Pemphis acidula | ކުރެދި (Kuredhi)"
        - "Jackfruit · Artocarpus heterophyllus | Sakkeyo"
        - "Jamaica cherry · Muntingia calabura | Jeymu"
        - "Jambolan · Syzygium cumini | Dhan’bu gas"
        - "Lantern tree · Hernandia nymphaeifolia | ކަންދު (Kandhu)"
        - "Large screwpine · Pandanus odoratissimus | Maakashikeyo"
        - "Latherleaf · Colubrina asiatica | Raarohi"
        - "Lemon · Citrus limon | Dhoalhan’bu"
        - "Lettuce tree · Pisonia grandis | ޅޮސް (Lhos)"
        - "Leucaena · Leucaena leucocephala | Ipil-ipil"
        - "Lime · Citrus aurantifolia | Lun’boa"
        - "Mango · Mangifera indica | އަނބު (An'bu)"
        - "Manila tamarind · Pithecellobium dulce | Kashi helebeli"
        - "Mature tea tree · Senna auriculata | Ranauraa"
        - "Narra · Pterocarpus indicus | Ofi elay gas"
        - "Neem · Azadirachta indica | ހިތި ގަސް (Hithi gas)"
        - "Noni · Morinda citrifolia | އަހި (Ahi)"
        - "Ochrosia · Ochrosia oppositifolia | ދުންބުރި (Dhun'buri)"
        - "Papaya · Carica papaya | Falho"
        - "Peacock flower · Caesalpinia pulcherrima | Fa’thangu"
        - "Pencil cactus · Euphorbia tirucalli | Eggamu muraka"
        - "Pomegranate · Punica granatum | Annaaru"
        - "Pond apple · Annona glabra | Kalhuthumeyvaa"
        - "Portia tree · Thespesia populnea | ހިރުނދު (Hirun'dhu)"
        - "Pummelo · Citrus maxima | Ban’bulhabos"
        - "Rain tree · Samanea saman | ބޮޑު ގަސް (Bodu gas)"
        - "Red bead tree · Adenanthera pavonina | މަދޮށި (Madhoshi)"
        - "Rose apple · Syzygium jambos | Janbu"
        - "Sand olive · Dodonaea viscosa | Kudhi-ruuvaali"
        - "Sapodilla · Manilkara zapota | Sabhudheli"
        - "Sappan wood · Caesalpinia sappan | Bey’s fathangu"
        - "Scrambled egg tree · Senna surattensis | Ranuwia"
        - "Screwpine · Pandanus tectorius | ކަށިކެޔޮ (Boa kashikeyo)"
        - "Sea poison tree · Barringtonia asiatica | ކިންބި (Kin'bi)"
        - "Sea trumpet · Cordia subcordata | ކާނި (Kaani)"
        - "Seaside clerodendron · Clerodendrum inerme | Dhun’gethi"
        - "Sesban · Sesbania grandiflora | Feerumuran’ga"
        - "Sour orange · Citrus aurantium | Naarin’gu"
        - "Sour plum · Ximenia americana | En’boo"
        - "Soursop · Annona muricata | Anoanaa"
        - "Star fruit · Averrhoa carambola | Kaamaranga"
        - "Star gooseberry · Phyllanthus acidus | Goan’bili"
        - "Sugar apple · Annona squamosa | Dhivehi atha"
        - "Tamarind · Tamarindus indica | Helen’beli"
        - "Tanjong tree · Mimusops elengi | Moonimaa"
        - "Teak · Tectona grandis | Haivakaru"
        - "Tree heliotrope · Tournefortia argentea | ބޮށި (Boshi)"
        - "Water apple · Syzygium aqueum | Jan’buroalu"
        - "Weeping fig · Ficus benjamina | Faiy kudhi nika"
        - "Not yet identified | ދެނެގަނެވިފައި ނުވޭ"
      default: 85
    validations:
      required: true

  - type: input
    id: size
    attributes:
      label: "Rough size | ބޮޑުމިން"
      description: >
        Optional. Girth is the distance around the trunk at about chest height. A piece
        of string and a tape measure is all it takes.
      placeholder: "Girth about 340 cm, roughly 14 m tall"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: "Anything else worth recording | އިތުރު މަޢުލޫމާތު"
      description: >
        Its story, who planted it, how long it has stood, what it is used for, whether
        anything is threatening it.
    validations:
      required: false

  - type: checkboxes
    id: private
    attributes:
      label: "Private land | އަމިއްލަ ބިން"
      options:
        - label: "This tree is on private land. Worth flagging: anyone going to survey it will need to ask permission first."
          required: false

  - type: checkboxes
    id: consent
    attributes:
      label: "Permission | ހުއްދަ"
      options:
        - label: "I am happy for this photograph and description to be published in the register under CC BY-SA 4.0."
          required: true
        - label: "No one is identifiable in this photograph, or everyone in it has agreed to it being published."
          required: true
